name: Build and Publish Gapino APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build installable Android APK
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Gapino.apk
          test -s Gapino.apk
          unzip -t Gapino.apk | tail -1
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Gapino-APK
          path: Gapino.apk
          if-no-files-found: error
      - name: Publish direct-download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 Gapino.apk --title 'Gapino Android 1.0.0' --notes 'Installable Android APK for Gapino. Requires a running HTTPS Gapino PHP/MySQL server. For testing; debug signed.'
